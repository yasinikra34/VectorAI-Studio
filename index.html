<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VectorAI Studio</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* --- AÇILIŞ KAPAK EKRANI (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* --- ANA ÇİZİM ALANI --- */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Beyaz Kâğıt Çizim Alanı */
        #canvas-wrapper {
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            background-color: #ffffff;
            padding: 6px;
        }

        canvas {
            display: block;
            background-color: #ffffff;
            cursor: crosshair;
            border-radius: 4px;
            touch-action: none;
        }

        /* Altın Temalı Araç Çubuğu */
        .toolbar {
            position: absolute;
            bottom: 30px;
            z-index: 20;
            display: flex;
            gap: 15px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: #1a1a1a;
            color: #d4af37;
            border: 1px solid #d4af37;
        }
    </style>
</head>
<body>

    <!-- Açılış Kapak Ekranı -->
    <div id="splash-screen">
        <img src="watermarked_img_6155727846959132032.jpg" alt="VectorAI Studio Cover">
    </div>

    <!-- Uygulama Ana Alanı -->
    <div id="app-container">
        <div id="canvas-wrapper">
            <canvas id="paintCanvas" width="340" height="520"></canvas>
        </div>

        <div class="toolbar">
            <button class="btn" id="clearBtn">Temizle</button>
            <button class="btn btn-secondary" id="saveBtn">Kaydet</button>
        </div>
    </div>

    <script>
        // Kapak ekranını 2.5 saniye gösterip çizim alanına geç
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                }, 800);
            }, 2500);
        });

        // Çizim Mantığı
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        // Altın Çizim Ayarı
        ctx.strokeStyle = '#d4af37'; 
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            ctx.lineTo(clientX - rect.left, clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'vectorai-cizim.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
